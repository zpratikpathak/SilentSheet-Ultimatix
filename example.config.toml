[employee]
# Your Employee ID
EMPLOYEE_ID = "YOUR_EMPLOYEE_ID_HERE"

[timesheet]
# The task name as it appears in the timesheet grid (e.g., "Development", "Meeting")
task_name = "Development"

# The charge type for the task. 
# Supported values typically include: "Billable", "Non Billable"
charge_type = "Billable"

# [browser]
# Set automatically after Chrome repeatedly fails to launch and SilentSheet
# falls back to Edge. When true, future runs skip the Chrome launch attempt
# entirely and use Edge directly.
# prefer_edge = true
